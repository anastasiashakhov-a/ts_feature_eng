[project]
name = "ts_feature_eng"
version = "0.1.0"
description = "Automatic feature engineering for time series forecasting"
authors = [
    {name = "anastasiashakhov-a", email = "anastasia.shakhova1@gmail.com"},
]
dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.3.0",
    "scipy>=1.10.0",
    "PyWavelets<1.8",        # ПРАВИЛЬНОЕ ИМЯ ПАКЕТА!
    "statsmodels>=0.14.0",
    "scikit-optimize>=0.9.0",
    "matplotlib>=3.10.8",
    "pytest>=9.0.2",
    "seaborn>=0.13.2",
    "shap>=0.49.1",
    "docr>=0.2.1",
    "dcor>=0.7",
    "onnxruntime==1.20.1",
]
requires-python = ">=3.10"      # Обновлено для совместимости с современными пакетами
readme = "README.md"
license = {text = "MIT"}

[project.optional-dependencies]
shap = ["shap>=0.44.0"]
test = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "coverage[toml]>=7.0.0",
]
dev = [
    "ruff>=0.15.0",
    "pre-commit>=4.5.1",
]

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
exclude = ["tests/", "__pycache__", ".git", ".venv"]